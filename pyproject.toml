[project]
name = "vcf_analysis_agent"
version = "0.1.0"
description = "VCF Analysis Agent using bcftools, strands, and AI."
authors = [
  { name = "elementalcollision", email = "your-email@example.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pytest",
    "pytest-cov",
    "pre-commit",
    # "bcftools",  # Python wrapper, if available on PyPI
    # "strands",   # If available on PyPI
]

[project.optional-dependencies]
cli-validation = [
    "docstring-parser>=0.15",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "tomli>=2.0.0; python_version<'3.11'",
    "PyYAML>=6.0"
]
dev = [
    "black",
    "isort", 
    "flake8",
    "mypy"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# Explicitly tell setuptools where the package lives. Without this, auto-discovery
# can produce a wheel that omits parts of src/vcf_agent (e.g. when built in
# environments with a different cwd), so the installed package lags behind edits.
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vcf_agent = ["py.typed"]

[tool.coverage.run]
source = ["src/vcf_agent"]

[tool.coverage.paths]
metrics_file_rename = [
    "src/vcf_agent/metrics.py",       # New, correct path for reporting
    "src/vcf_agent/logging_metrics.py"  # Old path present in .coverage data
]

[tool.pytest.ini_options]
# ... existing code ... 