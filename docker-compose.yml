version: '3.8'

volumes:
  lancedb_data: {}
  kuzu_data: {}
  vcf_data: {}

networks:
  vcf_network:
    driver: bridge

services:
  # =============================================================================
  # VCF Analysis Agent - Main Application (standalone, no observability stack)
  # =============================================================================
  vcf-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        - BCFTOOLS_VERSION=1.19
        - HTSLIB_VERSION=1.19
    container_name: vcf_analysis_agent
    restart: unless-stopped
    networks:
      - vcf_network
    ports:
      - "8000:8000"  # Main application port (Prometheus metrics, if needed)
    # Keep the container alive as a long-running service.
    # Drive the agent via `docker compose exec vcf-agent python -m vcf_agent.cli ...`.
    command: ["tail", "-f", "/dev/null"]
    volumes:
      - vcf_data:/app/data
      - lancedb_data:/app/lancedb
      - kuzu_data:/app/kuzu_db
      # Read-write bind mount: drop your .vcf / .vcf.gz files here on the host,
      # then ingest from /app/vcf inside the container.
      - ./vcf_uploads:/app/vcf
      - ./sample_data:/app/sample_data:ro  # Read-only sample data
      - ./config:/app/config:ro  # Read-only configuration
    environment:
      - PYTHONUNBUFFERED=1
      - LANCEDB_PATH=/app/lancedb
      - KUZU_PATH=/app/kuzu_db
      - LOG_LEVEL=INFO
      # Z.AI (GLM) model provider (default). Coding Plan endpoint.
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - ZAI_API_BASE=${ZAI_API_BASE:-https://api.z.ai/api/coding/paas/v4}
      - ZAI_MODEL_ID=${ZAI_MODEL_ID:-glm-5.2}
      # Embeddings via local OpenAI-compatible server (LM Studio, bge-m3).
      # On Docker Desktop the host's LM Studio is reachable via host.docker.internal.
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-http://host.docker.internal:1234/v1}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-lm-studio}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-bge-m3}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1024}
    healthcheck:
      test: ["CMD", "python", "-c", "import vcf_agent; print('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =============================================================================
  # VCF Analysis Agent - Development Version
  # =============================================================================
  vcf-agent-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: vcf_analysis_agent_dev
    restart: "no"
    networks:
      - vcf_network
    ports:
      - "8001:8000"  # Development port
      - "8888:8888"  # Jupyter notebook
    volumes:
      - .:/app/src:rw  # Mount source code for development
      - vcf_data:/app/data
      - lancedb_data:/app/lancedb
      - kuzu_data:/app/kuzu_db
    environment:
      - PYTHONUNBUFFERED=1
      - DEVELOPMENT=true
      - LANCEDB_PATH=/app/lancedb
      - KUZU_PATH=/app/kuzu_db
    profiles:
      - development
    command: ["bash"]
